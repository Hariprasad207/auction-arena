spring:

  config:
    import: optional:file:.env[.properties]
    
  application:
    name: auction-arena

  datasource:
    url: jdbc:postgresql://localhost:5432/auction_arena
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
